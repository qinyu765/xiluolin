name: Release technical preview

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  quality:
    name: Release quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      checks: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify tag belongs to main
        shell: bash
        run: |
          git fetch origin main
          tag_ref="refs/tags/$GITHUB_REF_NAME"
          test "$(git cat-file -t "$tag_ref")" = "tag"
          tag_commit="$(git rev-list -n 1 "$tag_ref")"
          test "$tag_commit" = "$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$tag_commit" origin/main

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.26.2

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release version
        run: pnpm release:check
        env:
          RELEASE_TAG: ${{ github.ref_name }}

      - name: Run complete quality checks
        run: pnpm check

      - name: Audit npm dependencies
        run: pnpm audit --audit-level=high

      - name: Audit Rust dependencies
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: src-tauri
          # sqlx 的未启用 PostgreSQL 可选依赖；上游目前没有修复版本。
          ignore: RUSTSEC-2023-0071

      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false

  build:
    name: Build ${{ matrix.name }}
    needs: quality
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon DMG
            runner: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
            artifact: xiluolin-macos-arm64
            path: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            macos_deployment_target: "13.0"
          - name: Windows x64 NSIS
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
            artifact: xiluolin-windows-x64
            path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
            macos_deployment_target: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.26.2

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Rust target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Build installer
        run: pnpm tauri build --target "${{ matrix.target }}" --bundles "${{ matrix.bundles }}"
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos_deployment_target }}
          CMAKE_OSX_DEPLOYMENT_TARGET: ${{ matrix.macos_deployment_target }}

      - name: Verify macOS bundle
        if: runner.os == 'macOS'
        shell: bash
        run: |
          app="src-tauri/target/aarch64-apple-darwin/release/bundle/macos/XiLuoLin.app"
          dmg="$(find src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -name '*.dmg' -print -quit)"
          test -n "$dmg"
          file "$app/Contents/MacOS/xiluolin" | grep -q 'arm64'
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv --verbose=4 "$app" 2>&1 | grep -q 'Signature=adhoc'
          hdiutil verify "$dmg"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error
          retention-days: 14

  draft-release:
    name: Create draft prerelease
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout release notes
        uses: actions/checkout@v7

      - name: Download installer artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Create checksums
        shell: bash
        run: |
          cd release-assets
          find . -type f ! -name SHA256SUMS.txt -print0 \
            | sort -z \
            | xargs -0 sha256sum > SHA256SUMS.txt

      - name: Create draft GitHub prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          notes_file=".github/release-notes/${GITHUB_REF_NAME#v}.md"
          test -f "$notes_file"
          mapfile -d '' assets < <(find release-assets -type f -print0 | sort -z)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            test "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" = "true"
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
            gh release edit "$GITHUB_REF_NAME" \
              --draft \
              --prerelease \
              --title "XiLuoLin $GITHUB_REF_NAME" \
              --notes-file "$notes_file"
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --verify-tag \
              --draft \
              --prerelease \
              --title "XiLuoLin $GITHUB_REF_NAME" \
              --notes-file "$notes_file"
          fi
