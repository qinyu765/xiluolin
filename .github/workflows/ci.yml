name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check project version
        run: pnpm release:check

      - name: Check frontend
        run: pnpm check:frontend

  rust:
    name: Rust checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Rust stable
        shell: bash
        run: |
          rustup update stable
          rustup default stable
          rustup component add rustfmt

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Check Rust compilation
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  security:
    name: Dependency and secret checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      checks: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.26.2

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit npm dependencies
        run: pnpm audit --audit-level=high

      - name: Audit Rust dependencies
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: src-tauri
          # sqlx/tauri-plugin-sql 的未启用可选依赖只存在于 Cargo.lock；当前 target 不包含这些代码。
          ignore: RUSTSEC-2023-0071,RUSTSEC-2026-0235

      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false

  bundle:
    name: Bundle ${{ matrix.name }}
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'chore/v')
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon DMG
            runner: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
            macos_deployment_target: "13.0"
          - name: Windows x64 NSIS
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
            macos_deployment_target: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.26.2

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Rust target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Build macOS app
        if: runner.os == 'macOS'
        shell: bash
        run: pnpm tauri build --target "${{ matrix.target }}" --bundles app --no-sign
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos_deployment_target }}
          CMAKE_OSX_DEPLOYMENT_TARGET: ${{ matrix.macos_deployment_target }}

      - name: Sign macOS app
        if: runner.os == 'macOS'
        shell: bash
        run: |
          app="src-tauri/target/aarch64-apple-darwin/release/bundle/macos/XiLuoLin.app"
          codesign --force --deep --sign - \
            --entitlements src-tauri/Entitlements.plist \
            "$app"

      - name: Build macOS DMG
        if: runner.os == 'macOS'
        shell: bash
        run: pnpm tauri bundle --target "${{ matrix.target }}" --bundles dmg --no-sign
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos_deployment_target }}
          CMAKE_OSX_DEPLOYMENT_TARGET: ${{ matrix.macos_deployment_target }}

      - name: Build Windows installer
        if: runner.os == 'Windows'
        run: pnpm tauri build --target "${{ matrix.target }}" --bundles "${{ matrix.bundles }}"
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos_deployment_target }}
          CMAKE_OSX_DEPLOYMENT_TARGET: ${{ matrix.macos_deployment_target }}

      - name: Verify macOS bundle
        if: runner.os == 'macOS'
        shell: bash
        run: |
          app="src-tauri/target/aarch64-apple-darwin/release/bundle/macos/XiLuoLin.app"
          dmg="$(find src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -name '*.dmg' -print -quit)"
          test -n "$dmg"
          file "$app/Contents/MacOS/xiluolin" | grep -q 'arm64'
          test -f "$app/Contents/Info.plist"
          codesign --verify --deep --verbose=2 "$app"
          codesign -dv --verbose=4 "$app" 2>&1 | grep -q 'Signature=adhoc'
          hdiutil verify "$dmg"

      - name: Verify Windows shared runtime in NSIS bundle
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $releaseDir = "src-tauri/target/x86_64-pc-windows-msvc/release"
          $dlls = @(Get-ChildItem -Path $releaseDir -Filter "*.dll" -File)
          if ($dlls.Count -eq 0) {
            throw "sherpa-onnx shared runtime DLLs are missing from the release directory"
          }
          $installer = Get-ChildItem -Path "$releaseDir/bundle/nsis" -Filter "*-setup.exe" -File | Select-Object -First 1
          if ($null -eq $installer) {
            throw "NSIS installer was not produced"
          }
          $listing = (& 7z l $installer.FullName | Out-String)
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to inspect the NSIS installer"
          }
          foreach ($dll in $dlls) {
            if ($listing -notmatch [regex]::Escape($dll.Name)) {
              throw "NSIS installer does not contain required runtime DLL: $($dll.Name)"
            }
          }
