name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "已有的 annotated release tag，例如 v0.1.0"
        required: true
        type: string

concurrency:
  group: release-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  quality:
    name: Release quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    permissions:
      contents: read
      checks: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_tag || github.ref_name }}

      - name: Verify tag belongs to main
        shell: bash
        run: |
          git fetch origin main
          tag_ref="refs/tags/$RELEASE_TAG"
          test "$(git cat-file -t "$tag_ref")" = "tag"
          tag_commit="$(git rev-list -n 1 "$tag_ref")"
          test "$tag_commit" = "$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$tag_commit" origin/main

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.26.2

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release version
        run: pnpm release:check
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

      - name: Run frontend quality checks
        run: pnpm check:frontend

      - name: Audit npm dependencies
        run: pnpm audit --audit-level=high

      - name: Audit Rust dependencies
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: src-tauri
          # sqlx/tauri-plugin-sql 的未启用可选依赖只存在于 Cargo.lock；当前 target 不包含这些代码。
          ignore: RUSTSEC-2023-0071,RUSTSEC-2026-0235

      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false

  build:
    name: Build ${{ matrix.name }}
    needs: quality
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon DMG
            runner: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
            artifact: xiluolin-macos-arm64
            path: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            macos_deployment_target: "13.0"
          - name: Windows x64 NSIS
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
            artifact: xiluolin-windows-x64
            path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
            macos_deployment_target: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag || github.ref_name }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.26.2

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Rust target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Verify generated bindings
        if: runner.os == 'macOS'
        run: pnpm bindings:check

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --target "${{ matrix.target }}"

      - name: Build installer
        run: pnpm tauri build --target "${{ matrix.target }}" --bundles "${{ matrix.bundles }}"
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos_deployment_target }}
          CMAKE_OSX_DEPLOYMENT_TARGET: ${{ matrix.macos_deployment_target }}

      - name: Verify macOS bundle
        if: runner.os == 'macOS'
        shell: bash
        run: |
          app="src-tauri/target/aarch64-apple-darwin/release/bundle/macos/XiLuoLin.app"
          dmg="$(find src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -name '*.dmg' -print -quit)"
          test -n "$dmg"
          file "$app/Contents/MacOS/xiluolin" | grep -q 'arm64'
          test -f "$app/Contents/Info.plist"
          codesign --verify --deep --verbose=2 "$app"
          codesign -dv --verbose=4 "$app" 2>&1 | grep -q 'Signature=adhoc'
          hdiutil verify "$dmg"

      - name: Verify Windows shared runtime in NSIS bundle
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $releaseDir = "src-tauri/target/x86_64-pc-windows-msvc/release"
          $dlls = @(Get-ChildItem -Path $releaseDir -Filter "*.dll" -File)
          if ($dlls.Count -eq 0) {
            throw "sherpa-onnx shared runtime DLLs are missing from the release directory"
          }
          $installer = Get-ChildItem -Path "$releaseDir/bundle/nsis" -Filter "*-setup.exe" -File | Select-Object -First 1
          if ($null -eq $installer) {
            throw "NSIS installer was not produced"
          }
          $listing = (& 7z l $installer.FullName | Out-String)
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to inspect the NSIS installer"
          }
          foreach ($dll in $dlls) {
            if ($listing -notmatch [regex]::Escape($dll.Name)) {
              throw "NSIS installer does not contain required runtime DLL: $($dll.Name)"
            }
          }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    permissions:
      contents: write

    steps:
      - name: Checkout release notes
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag || github.ref_name }}

      - name: Download installer artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: xiluolin-*
          path: release-assets
          merge-multiple: true

      - name: Create checksums
        shell: bash
        run: |
          cd release-assets
          find . -type f ! -name SHA256SUMS.txt -print0 \
            | sort -z \
            | xargs -0 sha256sum > SHA256SUMS.txt

      - name: Create and publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          notes_file=".github/release-notes/${RELEASE_TAG#v}.md"
          test -f "$notes_file"
          mapfile -d '' assets < <(find release-assets -type f -print0 | sort -z)

          is_prerelease=false
          if [[ "$RELEASE_TAG" == *-* ]]; then
            is_prerelease=true
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = "true"
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --verify-tag \
              --draft \
              --title "XiLuoLin $RELEASE_TAG" \
              --notes-file "$notes_file"
          fi

          if [[ "$is_prerelease" == true ]]; then
            gh release edit "$RELEASE_TAG" \
              --draft \
              --prerelease \
              --title "XiLuoLin $RELEASE_TAG" \
              --notes-file "$notes_file"
          else
            gh release edit "$RELEASE_TAG" \
              --draft=false \
              --prerelease=false \
              --title "XiLuoLin $RELEASE_TAG" \
              --notes-file "$notes_file"
          fi
